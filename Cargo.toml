[package]
name = "jdrgb"
version = "0.1.0"
edition = "2021"
description = "Minimal one-shot static-color setter for the ASUS Aura USB LED controller (0B05:19AF) and ASUS GPU ENE controller"

[lib]
name = "jdrgb"
path = "src/lib.rs"

# Two binaries because a PE has one subsystem: the CLI must be a console app,
# the tray must not be, and they share the color tables via the lib above.
[[bin]]
name = "jdrgb"
path = "src/main.rs"

[[bin]]
name = "jdrgb-tray"
path = "src/tray/main.rs"

[dependencies]
# No hidapi. Its enumeration opens every HID device on the machine and asks the
# matching ones for their string descriptors, which wedged a UPS — and the crate
# offers no way to avoid it, since `HidApi::new()` calls `add_devices(0, 0)`
# unconditionally and `disable_device_discovery()` is libusb-only. `src/hid.rs`
# opens one device by path instead. See docs/ups-wedge-incident.md.
windows-sys = { version = "0.61", features = [
    "Win32_System_Console",
    "Win32_System_IO",                # overlapped HID reads and writes
    "Win32_System_LibraryLoader",     # LoadLibraryA/GetProcAddress for nvapi64.dll
    "Win32_System_SystemInformation", # GetTickCount64, for the stash's boot check
    "Win32_Storage_FileSystem",       # CreateFileW/ReadFile/WriteFile for the HID device
    "Win32_Devices_DeviceAndDriverInstallation", # CM_Get_Device_Interface_List, opens nothing
    "Win32_Devices_HumanInterfaceDevice",        # HidD_/HidP_ for the one device we open
    "Win32_Foundation",
    # jdrgb-tray only. These cost jdrgb.exe nothing: windows-sys is pure FFI
    # declarations, and an unreferenced one emits no code and no import.
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_Security", # CreateMutexW takes a SECURITY_ATTRIBUTES pointer
] }

[profile.release]
opt-level = "z"     # optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true
